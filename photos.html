<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صور المنتجات — الأمراء</title>
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --card:#fff; --brand:#4f46e5; --accent:#e8490f; --ok:#16a34a; --danger:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Alexandria,system-ui,sans-serif;font-size:14px;line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 100px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:700}
  h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .sub{color:var(--muted);font-size:12.5px;margin:0}
  a.back{color:var(--brand);font-size:13px;text-decoration:none}
  a.back:hover{text-decoration:underline}

  .search-row{display:flex;gap:8px;margin-bottom:16px}
  .search-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:11px 14px;
       font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .search-row input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}

  /* Products needing photos surface first — that queue is the whole point
     of this page, so it should never require scrolling to find. */
  .queue-banner{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;
       padding:12px 15px;margin-bottom:16px;font-size:13px;color:#9a3412}
  .queue-banner strong{font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
       cursor:pointer;transition:border-color .15s,transform .15s}
  .pcard:hover{border-color:var(--brand)}
  .pcard:active{transform:scale(.98)}
  .pcard .thumb{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;
       justify-content:center;position:relative;overflow:hidden}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover}
  .pcard .thumb .ph-count{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(15,23,42,.8);
       color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px}
  .pcard .thumb .needs{position:absolute;top:6px;inset-inline-start:6px;background:var(--accent);
       color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
  .pcard .no-img{color:var(--muted);font-size:11px;text-align:center;padding:0 10px}
  .pcard .body{padding:9px 10px}
  .pcard .name{font-size:12.5px;font-weight:600;margin:0 0 3px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .meta{font-size:11px;color:var(--muted)}

  /* شريط تقدّم صغير على الكارت: بيقول فورًا فضل كام لون */
  .pcard .bar{height:4px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-top:7px}
  .pcard .bar span{display:block;height:100%;background:var(--ok);border-radius:99px}
  .pcard .done{border-color:#bbf7d0}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;
       font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .pill-hidden{position:absolute;top:6px;inset-inline-end:6px;background:#475569;color:#fff;
       font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px}

  /* editor */
  .veil{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:80;display:none}
  .veil.on{display:block}
  .sheet{position:fixed;inset-inline:0;bottom:0;z-index:81;background:#fff;
       border-radius:16px 16px 0 0;max-height:94vh;overflow-y:auto;
       transform:translateY(100%);transition:transform .25s ease;
       box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
  .sheet.on{transform:translateY(0)}
  .sheet-inner{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .sheet-close{background:none;border:0;font-size:20px;color:var(--muted);padding:4px 8px;cursor:pointer}

  /* اللون أولًا: كل لون سطر واضح فيه عدّاده — مش شيب صغير يتنسى */
  .clist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .crow{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
       border-bottom:1px solid #f1f5f9;background:#fff}
  .crow:last-child{border-bottom:0}
  .crow.on{background:#eef2ff}
  .crow .cname{flex:1;font-size:13.5px;font-weight:600}
  .crow .ccount{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
       background:#f1f5f9;color:var(--muted)}
  .crow .ccount.has{background:#dcfce7;color:var(--ok)}
  .crow .cthumb{width:34px;height:34px;border-radius:8px;object-fit:cover;
       border:1px solid var(--line);flex:0 0 auto;background:var(--bg)}
  .crow .cthumb.empty{display:flex;align-items:center;justify-content:center;
       color:var(--muted);font-size:15px}

  .shot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .shot{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;
       border:1.5px solid var(--line);background:var(--bg);cursor:pointer}
  .shot.cover{border-color:var(--ok);border-width:2.5px}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .color-tag{position:absolute;bottom:0;inset-inline:0;background:rgba(15,23,42,.75);
       color:#fff;font-size:10px;text-align:center;padding:3px 4px}
  .shot .cov{position:absolute;top:4px;inset-inline-start:4px;background:var(--ok);color:#fff;
       font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px}
  .shot.uploading{display:flex;align-items:center;justify-content:center}
  .shot .spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--brand);
       border-radius:99px;animation:sp .7s linear infinite}
  .add-shot{aspect-ratio:1/1;border-radius:10px;border:1.5px dashed var(--brand);
       background:#eef2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:4px;color:var(--brand);font-size:11px;font-weight:600;cursor:pointer;text-align:center;padding:6px}
  .add-shot svg{width:24px;height:24px}
  .add-shot:active{background:#e0e7ff}

  /* أكشنز صورة واحدة */
  .pactions{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.55);
       display:flex;align-items:flex-end}
  .pabox{background:#fff;width:100%;border-radius:16px 16px 0 0;
       padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .pabox h3{margin:0 0 4px;font-size:15px}
  .pa-btn{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fff;
       border-radius:10px;padding:12px 14px;font:inherit;font-size:13.5px;margin-bottom:8px;cursor:pointer}
  .pa-btn:active{background:var(--bg)}
  .pa-btn.danger{color:var(--danger);border-color:#fecaca}

  .stickybar{position:fixed;inset-inline:0;bottom:0;z-index:82;background:rgba(255,255,255,.97);
       backdrop-filter:blur(8px);border-top:1px solid var(--line);
       padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
  .stickybar button{width:100%;padding:14px;font-size:15px}

  .tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:8px;
       padding:10px 12px;font-size:12px;margin-bottom:14px;line-height:1.7}
  .warnbox{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;
       padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.7}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>صور المنتجات</h1>
      <p class="sub">صوّري أو ارفعي — تظهر على الموقع فورًا</p>
    </div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a class="back" href="website.html">مركز تحكّم الموقع ←</a><a class="back" href="products.html">→ رجوع للمنتجات</a></div>
  </header>
  <div id="app"><div class="center"><div class="spin-big"></div><p class="muted">جارٍ التحميل…</p></div></div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SUPABASE_URL = "https://mjetglnmivwphxyzflsz.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZXRnbG5taXZ3cGh4eXpmbHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTcwODgsImV4cCI6MjA5NjQzMzA4OH0.X6Rvxo4owPcBwE4HqXLm5fuPDSdEo8PV9oBV-bHsGrg";
const BUCKET = "product-images";

/* Same session-reuse pattern as merchandising.html — the owner is already
   signed in to the POS, and this page rides that session rather than asking
   again. */
function accessToken() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (/^sb-.*-auth-token$/.test(k)) {
        const v = JSON.parse(localStorage.getItem(k));
        if (v && v.access_token) return v.access_token;
      }
    }
  } catch (e) {}
  return null;
}

async function rpc(fn, args) {
  const tok = accessToken();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON_KEY, Authorization: `Bearer ${tok || ANON_KEY}` },
    body: JSON.stringify(args || {}),
  });
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!res.ok) throw new Error((data && (data.message || data.hint)) || `HTTP ${res.status}`);
  return data;
}

/* Direct upload to Storage. A Cairo mobile connection makes a raw 4-8MB phone
   photo a real cost in time and data — every shot is downscaled and
   re-encoded to JPEG in the browser first, which is the single biggest lever
   on how fast this page feels to use. */
function compressImage(file, maxDim = 2400, quality = 0.92) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("compress failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function uploadToStorage(productId, blob) {
  const tok = accessToken();
  const path = `${productId}/${crypto.randomUUID()}.jpg`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method: "POST",
    headers: {
      "Content-Type": "image/jpeg", apikey: ANON_KEY,
      Authorization: `Bearer ${tok || ANON_KEY}`, "x-upsert": "false",
    },
    body: blob,
  });
  if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(`رفع الصورة فشل: ${res.status} ${t.slice(0,120)}`); }
  return path;
}

function toast(msg, kind) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = kind || "";
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 3200);
}

const GENERIC = "__generic__";

/* ── قائمة المنتجات ───────────────────────────────────────────────
   الترتيب مقصود: اللي محتاج صور فوق. ده هو الطابور، مش قائمة تصفّح. */
function ProductGrid({ products, onOpen, filter, setFilter, tab, setTab }) {
  const q = filter.trim();
  const stateOf = (p) => {
    const total = (p.colors || []).length;
    const covered = total
      ? p.colors.filter((c) => (p.by_color || {})[c] > 0).length
      : (p.photo_count > 0 ? 1 : 0);
    const target = total || 1;
    if (p.photo_count === 0) return { key: "none", covered: 0, target };
    if (covered < target) return { key: "partial", covered, target };
    return { key: "done", covered, target };
  };

  const withState = products.map((p) => ({ ...p, st: stateOf(p) }));
  const counts = {
    none: withState.filter((p) => p.st.key === "none").length,
    partial: withState.filter((p) => p.st.key === "partial").length,
    done: withState.filter((p) => p.st.key === "done").length,
  };

  let list = withState;
  if (tab !== "all") list = list.filter((p) => p.st.key === tab);
  if (q) list = list.filter((p) => (p.name || "").includes(q));

  return (
    <>
      <div className="search-row">
        <input placeholder="دوّري على موديل…" value={filter}
               onChange={(e) => setFilter(e.target.value)} />
      </div>

      <div className="filters">
        {[["none", "محتاج صور", counts.none],
          ["partial", "ناقص ألوان", counts.partial],
          ["done", "تمام", counts.done],
          ["all", "الكل", withState.length]].map(([k, label, n]) => (
          <button key={k} className={`fchip${tab === k ? " on" : ""}`}
                  onClick={() => setTab(k)}>{label} ({n})</button>
        ))}
      </div>

      {tab === "none" && counts.none > 0 && (
        <div className="queue-banner">
          ابدئي بـ<strong>خمسة</strong> بس — أحسن خمس موديلات عندك. الموقع بيبيع بالصورة،
          والموديل من غير صورة زي ما يكون مش موجود.
        </div>
      )}

      <div className="grid">
        {list.map((p) => {
          const pct = Math.round((p.st.covered / p.st.target) * 100);
          return (
            <div className={`pcard${p.st.key === "done" ? " done" : ""}`} key={p.id}
                 onClick={() => onOpen(p)}>
              <div className="thumb">
                {p.st.key === "none" && <span className="needs">محتاج صور</span>}
                {!p.is_published && <span className="pill-hidden">مخفي</span>}
                {p.cover ? <img src={p.cover} alt="" loading="lazy" />
                         : <span className="no-img">بلا صورة</span>}
                {p.photo_count > 0 && <span className="ph-count">{p.photo_count} صورة</span>}
              </div>
              <div className="body">
                <p className="name">{p.name}</p>
                <p className="meta">
                  {(p.colors || []).length
                    ? `${p.st.covered} من ${p.st.target} ألوان`
                    : (p.photo_count ? `${p.photo_count} صورة` : "لسه")}
                </p>
                <div className="bar"><span style={{ width: `${pct}%` }} /></div>
              </div>
            </div>
          );
        })}
        {list.length === 0 && <div className="empty" style={{ gridColumn: "1/-1" }}>
          مفيش موديل هنا</div>}
      </div>
    </>
  );
}

/* ── محرّر صور منتج واحد ──────────────────────────────────────────
   اللون أولًا. الفلو القديم كان بيختار أول لون من نفسه، فأي صورة
   تترفع من غير ما حد ياخد باله بتتربط بلون غلط — وده أسوأ من إنها
   تفضل بلا لون، لأن العميلة بتشوف صورة مش بتاعة اللي اختارته. */
function Editor({ product, onClose, onChanged }) {
  const [images, setImages] = useState(product.images || []);
  const colors = product.colors || [];
  // لو لون واحد بس، اختياره تلقائيًا مش تخمين — هو الاختيار الوحيد.
  const [sel, setSel] = useState(colors.length === 1 ? colors[0] : null);
  const [busy, setBusy] = useState([]);
  const [acting, setActing] = useState(null);   // صورة مفتوح عليها الأكشنز
  const fileRef = useRef(null);

  const countFor = (c) => images.filter((i) =>
    c === GENERIC ? !i.color : i.color === c).length;
  const firstFor = (c) => images.find((i) =>
    c === GENERIC ? !i.color : i.color === c);

  const shown = sel === null ? images
    : images.filter((i) => (sel === GENERIC ? !i.color : i.color === sel));

  const pickFiles = () => {
    if (colors.length > 0 && sel === null) {
      toast("اختاري اللون الأول — عشان الصورة تظهر للعميلة لما تختار اللون ده", "err");
      return;
    }
    fileRef.current && fileRef.current.click();
  };

  const handleFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList || []);
    const tagColor = sel && sel !== GENERIC ? sel : null;
    for (const file of files) {
      const localId = crypto.randomUUID();
      setBusy((b) => [...b, localId]);
      try {
        const blob = await compressImage(file);
        const path = await uploadToStorage(product.id, blob);
        const res = await rpc("shop_fn_attach_product_image", {
          p_product_id: product.id, p_path: path, p_color: tagColor,
        });
        if (!res || res.ok === false) throw new Error((res && res.error) || "فشل الحفظ");
        setImages((imgs) => [...imgs, { id: res.id, url: res.url, color: tagColor }]);
        onChanged();
      } catch (e) {
        toast(e.message || "حصل خطأ أثناء الرفع", "err");
      } finally {
        setBusy((b) => b.filter((x) => x !== localId));
      }
    }
  }, [product.id, sel, onChanged]);

  const removeImage = async (img) => {
    if (!confirm("تأكيد حذف الصورة؟")) return;
    try {
      const res = await rpc("shop_fn_remove_product_image", { p_image_id: img.id });
      if (!res || res.ok === false) throw new Error((res && res.error) || "فشل الحذف");
      setImages((imgs) => imgs.filter((i) => i.id !== img.id));
      setActing(null); onChanged();
    } catch (e) { toast(e.message, "err"); }
  };

  const retag = async (img, color) => {
    try {
      const res = await rpc("shop_fn_update_product_image", {
        p_image_id: img.id,
        p_color: color === GENERIC ? null : color,
        p_clear_color: color === GENERIC,
      });
      if (!res || res.ok === false) throw new Error((res && res.error) || "فشل التعديل");
      setImages((imgs) => imgs.map((i) => i.id === img.id
        ? { ...i, color: color === GENERIC ? null : color } : i));
      setActing(null); onChanged();
      toast("اتظبط ✓", "ok");
    } catch (e) { toast(e.message, "err"); }
  };

  const makeCover = async (img) => {
    try {
      const res = await rpc("shop_fn_update_product_image",
        { p_image_id: img.id, p_make_cover: true });
      if (!res || res.ok === false) throw new Error((res && res.error) || "فشل التعديل");
      setImages((imgs) => imgs.map((i) => ({ ...i, is_cover: i.id === img.id })));
      setActing(null); onChanged();
      toast("بقت صورة الغلاف ✓", "ok");
    } catch (e) { toast(e.message, "err"); }
  };

  const missing = colors.filter((c) => countFor(c) === 0);

  return (
    <>
      <div className="veil on" onClick={onClose} />
      <div className="sheet on">
        <div className="sheet-inner">
          <div className="sheet-head">
            <div>
              <h2>{product.name}</h2>
              <p className="sub">{product.category || "—"}
                {!product.is_published && " · مخفي عن الموقع"}</p>
            </div>
            <button className="sheet-close" onClick={onClose}>✕</button>
          </div>

          {colors.length > 0 ? (
            <>
              {missing.length > 0 && (
                <div className="warnbox">
                  لسه من غير صور: <strong>{missing.join("، ")}</strong>.
                  العميلة لما تختار لون من دول هتشوف صورة لون تاني.
                </div>
              )}
              <label style={{ display: "block", fontSize: 12, fontWeight: 600,
                              color: "var(--muted)", marginBottom: 6 }}>
                اختاري اللون اللي بتصوّريه
              </label>
              <div className="clist">
                {colors.map((c) => {
                  const n = countFor(c); const f = firstFor(c);
                  return (
                    <div key={c} className={`crow${sel === c ? " on" : ""}`}
                         onClick={() => setSel(c)}>
                      {f ? <img className="cthumb" src={f.url} alt="" />
                         : <span className="cthumb empty">＋</span>}
                      <span className="cname">{c}</span>
                      <span className={`ccount${n ? " has" : ""}`}>
                        {n ? `${n} صورة` : "لسه"}</span>
                    </div>
                  );
                })}
                <div className={`crow${sel === GENERIC ? " on" : ""}`}
                     onClick={() => setSel(GENERIC)}>
                  {firstFor(GENERIC)
                    ? <img className="cthumb" src={firstFor(GENERIC).url} alt="" />
                    : <span className="cthumb empty">＋</span>}
                  <span className="cname">صور عامة (كل الألوان)</span>
                  <span className={`ccount${countFor(GENERIC) ? " has" : ""}`}>
                    {countFor(GENERIC) ? `${countFor(GENERIC)} صورة` : "لسه"}</span>
                </div>
              </div>
            </>
          ) : (
            <div className="tip">
              الموديل ده مسجّل من غير ألوان في المخزون، فالصور هتبقى عامة لكل الموديل.
            </div>
          )}

          <div className="tip">
            حيطة بيضا أو ورقة كانسون، ضوء الشباك مش الفلاش، وزاوية ٣ أرباع.
            ٣ أو ٤ صور لكل لون كفاية. دوسي على أي صورة عشان تغيّري لونها أو تخليها الغلاف.
          </div>

          <div className="shot-grid">
            {shown.map((img) => (
              <div className={`shot${img.is_cover ? " cover" : ""}`} key={img.id}
                   onClick={() => setActing(img)}>
                <img src={img.url} alt="" />
                {img.is_cover && <span className="cov">الغلاف</span>}
                <span className="color-tag">{img.color || "عام"}</span>
              </div>
            ))}
            {busy.map((id) => (
              <div className="shot uploading" key={id}><div className="spin" /></div>
            ))}
            <div className="add-shot" onClick={pickFiles}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M4 7h3l2-2h6l2 2h3v13H4z" strokeLinejoin="round" />
                <circle cx="12" cy="13" r="3.4" />
              </svg>
              {sel && sel !== GENERIC ? sel : "صوّري / ارفعي"}
            </div>
          </div>

          <input ref={fileRef} type="file" accept="image/*" multiple capture="environment"
                 style={{ display: "none" }}
                 onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
        </div>

        <div className="stickybar">
          <button className="btn-primary" onClick={pickFiles}>
            {colors.length > 0 && sel === null
              ? "اختاري لون الأول"
              : `صوّري${sel && sel !== GENERIC ? ` «${sel}»` : ""}`}
          </button>
        </div>
      </div>

      {acting && (
        <div className="pactions" onClick={() => setActing(null)}>
          <div className="pabox" onClick={(e) => e.stopPropagation()}>
            <h3>الصورة دي</h3>
            <p className="sub" style={{ marginBottom: 12 }}>
              اللون الحالي: {acting.color || "عام (كل الألوان)"}</p>
            {!acting.is_cover && (
              <button className="pa-btn" onClick={() => makeCover(acting)}>
                خليها صورة الغلاف</button>
            )}
            {colors.filter((c) => c !== acting.color).map((c) => (
              <button key={c} className="pa-btn" onClick={() => retag(acting, c)}>
                غيّر اللون لـ «{c}»</button>
            ))}
            {acting.color && (
              <button className="pa-btn" onClick={() => retag(acting, GENERIC)}>
                خليها عامة (كل الألوان)</button>
            )}
            <button className="pa-btn danger" onClick={() => removeImage(acting)}>
              احذف الصورة</button>
            <button className="pa-btn" onClick={() => setActing(null)}>إلغاء</button>
          </div>
        </div>
      )}
    </>
  );
}

function App() {
  const [products, setProducts] = useState(null);
  const [filter, setFilter] = useState("");
  const [tab, setTab] = useState("none");
  const [open, setOpen] = useState(null);
  const [error, setError] = useState("");

  const load = useCallback(async () => {
    try {
      // طابور إداري: بيشمل غير المنشور كمان — ده بالظبط اللي بيتصوّر
      // قبل ما ينزل الموقع. الكتالوج العام كان بيخفيه.
      const rows = await rpc("shop_fn_admin_photo_queue", { p_q: null });
      setProducts(Array.isArray(rows) ? rows : []);
    } catch (e) { setError(e.message || "تعذّر تحميل المنتجات"); }
  }, []);

  useEffect(() => { load(); }, [load]);

  const openProduct = async (p) => {
    try {
      const imgs = await rpc("shop_fn_admin_product_images", { p_product_id: p.id });
      setOpen({ ...p, images: imgs || [] });
    } catch (e) { toast(e.message, "err"); }
  };

  if (error) return <div className="center"><p style={{ color: "var(--danger)" }}>{error}</p></div>;
  if (!products) return <div className="center"><div className="spin-big" /><p className="muted">جارٍ التحميل…</p></div>;

  return (
    <>
      <ProductGrid products={products} filter={filter} setFilter={setFilter}
                   tab={tab} setTab={setTab} onOpen={openProduct} />
      {open && (
        <Editor product={open}
                onClose={() => { setOpen(null); load(); }}
                onChanged={load} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>

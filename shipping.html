<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الشحن — الأمراء</title>
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
    --brand:#4f46e5; --ok:#16a34a; --warn:#b45309; --danger:#dc2626; --money:#0f766e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Alexandria,system-ui,sans-serif;font-size:15px;line-height:1.6;
       padding-bottom:calc(84px + env(safe-area-inset-bottom))}

  header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
       padding:12px 14px calc(8px);box-shadow:0 1px 6px rgba(15,23,42,.05)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:18px;margin:0;font-weight:700}
  a.back{color:var(--brand);font-size:13px;text-decoration:none;white-space:nowrap}

  /* التبويبات: كبيرة، تتضغط بالإبهام */
  .tabs{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;
       padding:9px 16px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .n{display:inline-block;background:rgba(0,0,0,.08);border-radius:99px;
       padding:0 7px;margin-inline-start:6px;font-size:11.5px}
  .tab.on .n{background:rgba(255,255,255,.22)}

  .wrap{padding:12px 12px 0;max-width:760px;margin:0 auto}
  .search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
       font:inherit;font-size:15px;margin-bottom:12px;background:#fff}

  /* كارت الشحنة: كل المعلومة في نظرة، والزرار كبير */
  .ship{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:13px 14px;margin-bottom:10px}
  .ship.late{border-color:#fdba74;background:#fffbf5}
  .ship.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,70,229,.14)}
  .s-head{display:flex;align-items:flex-start;gap:10px}
  .s-head .who{flex:1;min-width:0}
  .name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr{font-size:12.5px;color:var(--muted);margin-top:2px;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cod{font-weight:700;font-size:16px;color:var(--money);white-space:nowrap;text-align:end}
  .cod small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .chip{background:#f1f5f9;border-radius:99px;padding:3px 9px;font-weight:600}
  .chip.st1{background:#e0e7ff;color:#3730a3}
  .chip.st2{background:#dbeafe;color:#1e40af}
  .chip.st3{background:#fef3c7;color:#92400e}
  .chip.st4{background:#dcfce7;color:#166534}
  .chip.late{background:#ffedd5;color:#9a3412}

  .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .acts button{flex:1;min-width:112px;border:0;border-radius:10px;padding:12px 10px;
       font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .go{background:var(--ink);color:#fff}
  .money{background:#0f766e;color:#fff}
  .alt{background:#fff;border:1px solid var(--line);color:var(--ink);flex:0 0 auto;min-width:0;padding:12px 14px}
  .acts button:active{transform:scale(.98)}
  .acts button:disabled{opacity:.5}

  /* تحديد جماعي */
  .pick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;
        flex:0 0 auto;display:flex;align-items:center;justify-content:center;
        font-size:15px;color:#fff;cursor:pointer;margin-top:2px}
  .pick.on{background:var(--brand);border-color:var(--brand)}

  .bulkbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);
        backdrop-filter:blur(10px);border-top:1px solid var(--line);
        padding:11px 12px calc(11px + env(safe-area-inset-bottom));
        display:flex;gap:8px;align-items:center;box-shadow:0 -6px 20px rgba(15,23,42,.09)}
  .bulkbar .cnt{font-size:13px;font-weight:700;white-space:nowrap}
  .bulkbar button{flex:1;border:0;border-radius:10px;padding:13px 8px;font:inherit;
        font-size:14px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
  .bulkbar button.ghost{background:#fff;border:1px solid var(--line);color:var(--muted);flex:0 0 auto;padding:13px 14px}

  .empty{text-align:center;padding:46px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px}
  .sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
       margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sum b{font-size:19px;color:var(--money)}

  /* لوحة سفلية للاختيارات الأقل */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end}
  .sheet-box{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
  .sheet-box h3{margin:0 0 3px;font-size:16px}
  .sheet-box p.sub{margin:0 0 13px;font-size:12.5px;color:var(--muted)}
  .opt{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fff;
       border-radius:11px;padding:14px;font:inherit;font-size:14.5px;font-weight:600;
       margin-bottom:8px;cursor:pointer}
  .opt:active{background:var(--bg)}
  .opt.danger{color:var(--danger);border-color:#fecaca}
  .opt small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .sheet-box input{width:100%;border:1px solid var(--line);border-radius:10px;
       padding:12px;font:inherit;font-size:15px;margin-bottom:10px}
  label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}

  #toast{position:fixed;inset-block-end:calc(92px + env(safe-area-inset-bottom));
    inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:99px;font-size:14px;font-weight:600;display:none;z-index:99;
    box-shadow:0 8px 26px rgba(0,0,0,.22);max-width:92vw;text-align:center}
  #toast.err{background:var(--danger)}
  .center{padding:60px 20px;text-align:center;color:var(--muted)}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);
        border-radius:99px;animation:sp .8s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <h1>الشحن</h1>
    <a class="back" href="dashboard.html">← رجوع</a>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="wrap" id="app"><div class="center"><div class="spin"></div>بحمّل…</div></div>
<div id="bulk"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="omraa-telemetry.js"></script>
<script src="shipping.js"></script>
</body>
</html>
